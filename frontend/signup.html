<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | On-Tap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrapper p-3">
    <div class="card auth-card p-4 p-md-5">
      <div class="text-center mb-4">
        <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-3">
          <span class="navbar-brand-logo"><i class="bi bi-wrench-adjustable"></i></span>
          <span class="fw-bold text-brand fs-4">On-Tap</span>
        </a>
        <h4 class="fw-bold mb-1">Create your account</h4>
        <p class="text-secondary mb-0">Join On-Tap today</p>
      </div>

      <div id="alert" class="alert d-none" role="alert"></div>

      <form id="signupForm">
        <div class="mb-3">
          <label class="form-label">I want to register as</label>
          <select id="userType" class="form-select">
            <option value="customer">Customer</option>
            <option value="provider">Service Provider</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input id="name" type="text" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input id="email" type="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input id="phone" type="tel" class="form-control" placeholder="+91-9876543210" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-brand w-100 py-2">Create Account</button>
      </form>

      <p class="text-center text-secondary mt-4 mb-0">
        Already have an account? <a href="signin.html" class="text-brand text-decoration-none fw-semibold">Sign in</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>initSignup();</script>
</body>
</html>
