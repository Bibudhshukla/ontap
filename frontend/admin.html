<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | On-Tap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <span class="navbar-brand-logo"><i class="bi bi-wrench-adjustable"></i></span>
        <span class="text-brand fs-4">On-Tap</span>
        <span class="badge text-bg-dark ms-2">Admin</span>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline-secondary">Home</a>
    </div>
  </nav>

  <div class="container py-4">
    <h3 class="fw-bold mb-4">Platform Overview</h3>
    <div id="alert" class="alert d-none" role="alert"></div>

    <div class="row g-3 mb-5" id="statsRow">
      <div class="col-12 text-center text-secondary py-4">
        <div class="spinner-border text-brand"></div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <h5 class="fw-bold mb-3">Users</h5>
        <div class="card border-0 shadow-sm">
          <div class="table-responsive" style="max-height: 420px;">
            <table class="table align-middle mb-0">
              <thead class="table-light"><tr><th>#</th><th>Name</th><th>Email</th><th>Type</th></tr></thead>
              <tbody id="usersBody"><tr><td colspan="4" class="text-center text-secondary py-4">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <h5 class="fw-bold mb-3">Recent Bookings</h5>
        <div class="card border-0 shadow-sm">
          <div class="table-responsive" style="max-height: 420px;">
            <table class="table align-middle mb-0">
              <thead class="table-light"><tr><th>#</th><th>Service</th><th>Date</th><th>Status</th></tr></thead>
              <tbody id="bookingsBody"><tr><td colspan="4" class="text-center text-secondary py-4">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
