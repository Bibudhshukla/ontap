<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Dashboard | On-Tap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <span class="navbar-brand-logo"><i class="bi bi-wrench-adjustable"></i></span>
        <span class="text-brand fs-4">On-Tap</span>
        <span class="badge text-bg-light border ms-2">Provider</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary">Hi, <span id="userName" class="fw-semibold text-dark"></span></span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div id="alert" class="alert d-none" role="alert"></div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="card stat-card p-3"><small class="text-secondary">Total Jobs</small><h4 id="statTotal" class="fw-bold mb-0">0</h4></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card p-3"><small class="text-secondary">Pending</small><h4 id="statPending" class="fw-bold mb-0">0</h4></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card p-3"><small class="text-secondary">In Progress</small><h4 id="statProgress" class="fw-bold mb-0">0</h4></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card p-3"><small class="text-secondary">Completed</small><h4 id="statDone" class="fw-bold mb-0">0</h4></div>
      </div>
    </div>

    <h3 class="fw-bold mb-3">Available &amp; Assigned Jobs</h3>
    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr><th>#</th><th>Service</th><th>Date</th><th>Address</th><th>Amount</th><th>Status</th><th>Action</th></tr>
          </thead>
          <tbody id="jobsBody">
            <tr><td colspan="7" class="text-center text-secondary py-4">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/provider.js"></script>
</body>
</html>
