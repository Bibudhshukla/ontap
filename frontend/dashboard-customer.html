<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Dashboard | On-Tap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <span class="navbar-brand-logo"><i class="bi bi-wrench-adjustable"></i></span>
        <span class="text-brand fs-4">On-Tap</span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary">Hi, <span id="userName" class="fw-semibold text-dark"></span></span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h3 class="fw-bold mb-4">Book a Service</h3>
    <div id="alert" class="alert d-none" role="alert"></div>
    <div id="servicesGrid" class="row g-4 mb-5"></div>

    <h3 class="fw-bold mb-3">My Bookings</h3>
    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>#</th><th>Service</th><th>Date</th><th>Time</th>
              <th>Address</th><th>Amount</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="bookingsBody">
            <tr><td colspan="8" class="text-center text-secondary py-4">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Booking Modal -->
  <div class="modal fade" id="bookingModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Book <span id="modalServiceName"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="bookingForm">
          <div class="modal-body">
            <input type="hidden" id="modalServiceId" />
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input id="bookingDate" type="date" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Time</label>
              <input id="bookingTime" type="time" class="form-control" value="10:00" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea id="bookingAddress" class="form-control" rows="2" required></textarea>
            </div>
            <div class="mb-1">
              <label class="form-label">Estimated Amount (Rs.)</label>
              <input id="bookingAmount" type="number" class="form-control" value="1500" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-brand">Confirm Booking</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
