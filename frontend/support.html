<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support | On-Tap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <span class="navbar-brand-logo"><i class="bi bi-wrench-adjustable"></i></span>
        <span class="text-brand fs-4">On-Tap</span>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline-secondary">Home</a>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 720px;">
    <h3 class="fw-bold mb-1">Help &amp; Support</h3>
    <p class="text-secondary">Raise a ticket and our team will get back to you.</p>

    <div id="alert" class="alert d-none" role="alert"></div>

    <div class="card border-0 shadow-sm p-4 mb-4">
      <form id="ticketForm">
        <div class="mb-3">
          <label class="form-label">Subject</label>
          <input id="subject" type="text" class="form-control" required />
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Category</label>
            <select id="category" class="form-select">
              <option value="general">General</option>
              <option value="bug">Bug</option>
              <option value="complaint">Complaint</option>
              <option value="feature_request">Feature Request</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Priority</label>
            <select id="priority" class="form-select">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="description" class="form-control" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-brand">Submit Ticket</button>
      </form>
    </div>

    <h5 class="fw-bold mb-3">Recent Tickets</h5>
    <div id="ticketList" class="vstack gap-2">
      <div class="text-secondary">Loading...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/support.js"></script>
</body>
</html>
